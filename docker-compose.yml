services:
  db:
    image: mariadb:11
    container_name: trackfinder-db
    environment:
      MARIADB_DATABASE: trackfinder
      MARIADB_USER: trackuser
      MARIADB_PASSWORD: trackpass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/juanje-urban/trackfinder-garage-backend:latest
    container_name: trackfinder-backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/trackfinder
      SPRING_DATASOURCE_USERNAME: trackuser
      SPRING_DATASOURCE_PASSWORD: trackpass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/juanje-urban/trackfinder-garage-frontend:latest
    container_name: trackfinder-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend


volumes:
  mariadb_data:
