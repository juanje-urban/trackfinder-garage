services:
  db:
    image: mariadb:11
    container_name: trackfinder-db
    environment:
      MARIADB_DATABASE: trackfinder
      MARIADB_USER: trackuser
      MARIADB_PASSWORD: trackpass
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: