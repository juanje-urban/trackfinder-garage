services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: trackfinder
      MARIADB_USER: trackuser
      MARIADB_PASSWORD: trackpass
      MARIADB_ROOT_PASSWORD: rootpass
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/trackfinder
      SPRING_DATASOURCE_USERNAME: trackuser
      SPRING_DATASOURCE_PASSWORD: trackpass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
